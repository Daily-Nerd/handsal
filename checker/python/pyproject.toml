[project]
name = "handsal-check"
version = "0.0.0"
description = "Reference checker for the handsal profile"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
handsal-check = "handsal_check.production:main"
handsal-check-conformance = "handsal_check.conformance:main"
handsal-check-server = "handsal_check.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handsal_check"]
