[project]
name = "handsal-throwaway"
version = "0.0.0"
description = "Throwaway genesis org tool and its tests"
requires-python = ">=3.11"
# `cryptography` signs the receipts of software keys (tools/genesis_throwaway.py) and is the stand-in verifier of
