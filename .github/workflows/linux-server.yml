# The server build (handsal-check-server) on real Linux amd64. The product runs there, so its
# packaging is built and tested there, not only on a Mac. Three jobs run in parallel, each with its own
# checkout and setup and every step of the former single job, so the longest one bounds the wall time:
# the unit suites (`server`), the vector generator tests (`vectors`) and the release proofs (`proofs`).
#
# The release proofs run the conformance vectors of every older edition from its tag (CF-15) and the catalog
# prefix test (GP-22). Every job takes the full history and every tag, and no step is soft or conditional: a
# catalog tag that is absent makes the run fail, never skip.
name: linux-server

# A pull request runs it once per push; main runs it once per merge. Pushing a branch
# without a pull request does not, so no change is paid for twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    # the unit suites, the vitni build command and the vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history: an older edition's tag is a commit of it
          fetch-tags: true # and every tag, named in the checkout so no later step has to ask

      # The Go toolchain has one home, tools/release/go-version: the binary holds the Go version, so the
      # release scripts and this job build vitni-verify with the same one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/release/go-version
          cache: false # one build, nothing to cache

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13" # checker/python/.python-version
          enable-cache: false # the harness has no dependencies, nothing to cache

      # The cgo-free cross build of RS4: a static binary, so no libc of the image decides what runs. The one
      # vitni build command of the release scripts, at the commit of tools/release/vitni-commit.
      - name: vitni for linux/amd64, no cgo
        run: |
          sh tools/release/build-vitni.sh linux amd64 "$RUNNER_TEMP/vitni-verify"
          file "$RUNNER_TEMP/vitni-verify"
          ldd "$RUNNER_TEMP/vitni-verify" 2>&1 | grep -q 'not a dynamic executable'

      - name: The vitni build command
        run: sh tools/release/test-build-vitni.sh

      - name: The release vulnerability gate
        run: sh tools/release/test-vuln-gate.sh

      - name: Checker environment
        run: uv sync --project checker/python

      # The genesis tool suite calls checker internals. No other step runs it, so a checker change could break it
      # unseen. Without an installed vitni its real-vitni test asserts verifier_unavailable; nothing is skipped.
      - name: Throwaway suite
        run: uv run --project tools/throwaway python -I -m unittest discover -s tools/throwaway/tests -t tools/throwaway

      # The unit suites, each by the command of tools/release/final-proof.sh (tools/tests/test_workflows.py reads
      # it from there), so the local proof and this job cannot drift. The server and packaging steps below run the
      # same checker suite again, narrowed to one file.
      - name: Checker suite
        run: uv run --project checker/python python -I -m unittest discover -s checker/python/tests -t checker/python

      - name: Tools suite
        run: uv run python -I -m unittest discover -s tools/tests -t tools

      # The catalog check, by the command of the `catalog` step of tools/release/final-proof.sh. Its last census
      # compares conformance/reason-classes.json with the one of the newest earlier tag: a class that was published
      # never changes, it is only added to. It reads that tag, which the checkout above fetched.
      - name: Catalog check
        run: uv run python -I tools/check_catalog.py

      - name: Conformance tests
        run: uv run --no-project python -I -m unittest discover -s conformance/tests -t conformance


  vectors:
    # the vector generator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history: an older edition's tag is a commit of it
          fetch-tags: true # and every tag, named in the checkout so no later step has to ask

      # The Go toolchain has one home, tools/release/go-version: the binary holds the Go version, so the
      # release scripts and this job build vitni-verify with the same one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/release/go-version
          cache: false # one build, nothing to cache

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13" # checker/python/.python-version
          enable-cache: false # the harness has no dependencies, nothing to cache

      # The cgo-free cross build of RS4: a static binary, so no libc of the image decides what runs. The one
      # vitni build command of the release scripts, at the commit of tools/release/vitni-commit.
      - name: vitni for linux/amd64, no cgo
        run: |
          sh tools/release/build-vitni.sh linux amd64 "$RUNNER_TEMP/vitni-verify"
          file "$RUNNER_TEMP/vitni-verify"
          ldd "$RUNNER_TEMP/vitni-verify" 2>&1 | grep -q 'not a dynamic executable'

      - name: Checker environment
        run: uv sync --project checker/python

      - name: Vector generator tests
        run: uv run --project conformance/vectors/_gen python -I -m unittest discover -s conformance/vectors/_gen/tests -t conformance/vectors/_gen


  proofs:
    # the server, packaging and zipapp proofs, and the conformance runs with the linux/amd64 vitni
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history: an older edition's tag is a commit of it
          fetch-tags: true # and every tag, named in the checkout so no later step has to ask

      # The Go toolchain has one home, tools/release/go-version: the binary holds the Go version, so the
      # release scripts and this job build vitni-verify with the same one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/release/go-version
          cache: false # one build, nothing to cache

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13" # checker/python/.python-version
          enable-cache: false # the harness has no dependencies, nothing to cache

      # The cgo-free cross build of RS4: a static binary, so no libc of the image decides what runs. The one
      # vitni build command of the release scripts, at the commit of tools/release/vitni-commit.
      - name: vitni for linux/amd64, no cgo
        run: |
          sh tools/release/build-vitni.sh linux amd64 "$RUNNER_TEMP/vitni-verify"
          file "$RUNNER_TEMP/vitni-verify"
          ldd "$RUNNER_TEMP/vitni-verify" 2>&1 | grep -q 'not a dynamic executable'

      - name: Checker environment
        run: uv sync --project checker/python

      - name: Server tests
        run: uv run --project checker/python python -I -m unittest discover -s checker/python/tests -t checker/python -p test_server.py

      - name: Packaging tests
        run: uv run --project checker/python python -I -m unittest discover -s checker/python/tests -t checker/python -p test_packaging.py

      - name: The server zipapp is reproducible
        run: |
          build=checker/python/packaging/build_zipapp.py
          uv run --no-project python -I "$build" --entry handsal_check.server:main "$RUNNER_TEMP/one.pyz" | tee "$RUNNER_TEMP/one.sum"
          uv run --no-project python -I "$build" --entry handsal_check.server:main "$RUNNER_TEMP/two.pyz" | tee "$RUNNER_TEMP/two.sum"
          cmp "$RUNNER_TEMP/one.pyz" "$RUNNER_TEMP/two.pyz"

      # run.py takes only absolute implementation paths, split like a POSIX shell.
      - name: Conformance, checker role, linux/amd64 vitni
        run: |
          impl="$GITHUB_WORKSPACE/checker/python/.venv/bin/handsal-check-conformance --vitni $RUNNER_TEMP/vitni-verify"
          uv run --no-project python -I conformance/run.py --impl "$impl" --role checker

      # CF-15: each catalog entry that is not the current core runs from its tag, after the bundle hash recomputed
      # from the tag's tree equals the catalog's. A missing tag, an unreadable tree or a different hash exits 2.
      - name: Conformance, every older edition from its tag
        run: |
          impl="$GITHUB_WORKSPACE/checker/python/.venv/bin/handsal-check-conformance --vitni $RUNNER_TEMP/vitni-verify"
          uv run --no-project python -I conformance/run.py --impl "$impl" --role checker --tags

      # GP-22 S3: this release's catalog extends the catalog of the previous tag, which needs that tag.
      - name: The catalog extends the previous tag's
        run: >
          uv run --project checker/python python -I -m unittest discover -s checker/python/tests -t checker/python
          -p test_profile_set.py
          -k test_a_release_keeps_every_edition_the_previous_tag_listed
          -k test_this_release_extends_the_catalog_of_the_previous_tag

      - name: Linux installer
        run: sh tools/install/test-install-linux.sh
